<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS-2</title>
</head>
<body>
    
    <!-- Q1 SAVE STUDENT NAME -->
    <div class="card">
        <h2>Q1. Save Student Name</h2>
        <input type="text" id="studentName" placeholder="Enter student name">
        <button id="saveBtn">Save</button>
    </div>

    <!-- Q2 RETRIEVE STUDENT NAME -->
    <div class="card">
        <h2>Q2. Retrieve Student Name</h2>
        <button id="displayNameBtn">Display</button>
        <h3 id="nameHeading"></h3>
    </div>

    <!-- Q3: SAVE AND DISPLAY EMAIL -->
    <div class="card">
        <h2>Q3. Save and Display Email</h2>
        <input type="email" id="emailInput" placeholder="Enter email">
        <button id="saveEmailBtn">Save</button>
        <p class="output" id="emailOutput"></p>
    </div>

    <!-- Q4: REMOVE STORED DATA -->
    <div class="card">
        <h2>Q4. Remove Stored Data</h2>
        <input type="text" id="usernameInput" placeholder="Enter username">
        <button id="saveUserBtn">Save Username</button>
        <button id="removeUserBtn" class="danger">Remove</button>
        <p class="output" id="usernameOutput"></p>
        <p id="msg4"></p>
    </div>

    <!-- Q5: SAVE AND RETRIEVE CITY NAME -->
    <div class="card">
        <h2>Q5. Save and Retrieve City Name</h2>
        <input type="text" id="cityInput" placeholder="Enter city name">
        <button id="saveCityBtn">Save City</button>
        <button id="displayCityBtn">Display City</button>
        <p class="output" id="cityOutput"></p>
    </div>

    <script src="index.js"></script>
</body>
</html>
