<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoply</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- navbar -->
    <div class="navbar">
        <h2 class="logo">Shoply</h2>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#shop">Shop</a>
            <a href="#cart">Cart</a>
        </div>

        <a href="#cart" class="cart-link">Cart (<span id="cart-count">0</span>)</a>
    </div>

    <!-- hero -->
    <div class="hero">
        <h1>Welcome to Shoply</h1>
        <p>Find all kinds of products at good prices.</p>
        <a href="#shop" class="hero-btn">Shop Now</a>
    </div>

    <div class="page">

    <!-- products -->
    <div class="shop" id="shop">
        <h2>Our Products</h2>

        <div class="filters">
            <input type="text" id="search" placeholder="Search products...">

            <select id="category">
                <option value="all">All Categories</option>
            </select>

            <select id="sort">
                <option value="default">Sort By</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
                <option value="name">Name: A to Z</option>
            </select>
        </div>

        <p id="message">Loading...</p>

        <div id="products" class="products"></div>

        <button id="load-more" style="display: none;">Load More</button>
    </div>

    <!-- cart -->
    <div class="cart" id="cart">
        <h2>Your Cart</h2>
        <div id="cart-items">Your cart is empty.</div>
        <p class="total">Total: $<span id="cart-total">0.00</span></p>
    </div>

    </div>
    <!-- end of page -->


    <!-- footer -->
    <div class="footer">
        <p>&copy; 2026 Shoply</p>
    </div>

    <script src="index.js"></script>
</body>
</html>
